database-type:
  type: sqlite # выберите тип базы данных sqlite/mysql/yaml
sqlite:
  file: playerdata.db
mysql:
  host: localhost
  port: 3306
  database: erybuyer
  username: root
  password: ""
  use-ssl: false
  table-prefix: "EryBuyer" # - префикс для таблиц, например "erybuyer_" если в одной базе несколько плагинов
yaml:
  file: playerdata.yml
# объяснение по sqlite, mysql и yaml
# sqlite современный формат для базы данных и более оптимизированный рекомендую использовать именно его
# mysql - внешняя база данных, нужна если у вас несколько серверов с общими данными скупщика (база должна быть создана заранее)
# yaml - старый формат для базы данных и с ужасной оптимизацией не рекомендуется его использовать если не хотите навредить серверу
