# Описание плагина
# поддерживаемые версии
# 1.16-1.21+
# Зависимости
# Vault, PlaceholderAPI
# актионы
# [close] - закрытие меню
# [openmenu] - открытие меню
# [command] - выполнение команд
# [sound] произведение звуков
# Плагин разработан студией EryDev
message:
  error-no-item: "&#FFCC00▪ &#FFFFFFУ вас нет предмета &#FFA500%item_name%"
  successfully-buyer: "&#FFCC00▪ &#FFFFFFВы успешно продали &#FFA500%item_name% &#FFFFFFза &#FF0000%prince%"
  autobuyer-use: "&#FFCC00▪ &#FFFFFFВы продали скупщику &#FFA500%item_sell% &#FFFFFFштук, баланс &#FF0000%vault_eco_balance%"
  autobuyer-on: "&#FFCC00▪ &#FFFFFFАвто-скупщик &#FFA500%autobuyer_status%"
  autobuyer-off: "&#FFCC00▪ &#FFFFFFАвто-скупщик &#FF0000%autobuyer_status%"
  error-permission: "&#FF0000▪ &#FFFFFFУ вас недостаточно прав"
  new-level: "&#FFFFFFВы достигли уровня &#FFCC00%new_level%"
  config-reload: "&#FFCC00▪ &#FFFFFFКонфиг успешно перезагружен"
  level-info:
    - "&#FFFFFFВаша статистика уровней"
    - ""
    - "&#FFFFFFОбщая сумма продаж &#FFA500%buyer_total_earned%"
    - "&#FFFFFFТекущий уровень &#FFCC00%buyer_current_level%"
    - "&#FFFFFFДо следующего уровня &#FF0000%buyer_next_level%"
placeholder:
  enable-autobuyer: "&c▪ &aВключен"
  disable-autobuyer: "&c▪ &cВыключен"
sound:
  sound_open_menu:
    sound: BLOCK_CHEST_OPEN
    enabled: true
  no-item-sound:
    sound: ENTITY_VILLAGER_NO
    enabled: true
  autobuyer-sound:
    sound: BLOCK_NOTE_BLOCK_XYLOPHONE
    enabled: true
database: # база данных
  sqlite:
    file: playerdata.db # название файла sqlite
bossbar-settings:
  bossbar: true
  text: "&c▪ &fУ вас &aвключён &cавто-скупщик"
  color: RED
  autobuyer-time: 40
buyer-top:
  update-money: 14000 # максимальная сумма от которой будет обновление топов
  update-interval: 20 # время обновления топов
